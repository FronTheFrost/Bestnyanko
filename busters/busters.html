<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바스터즈 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
        }
        .tier-content-wrapper.active {
            display: block !important;
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            min-height: 48px;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <!-- 바스터즈 배너 적용 -->
    <div class="tier-banner" onclick="toggleTierList()">
        <img src="IMG_1740.jpeg" alt="바스터즈 축제 배너">
    </div>

    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- SS등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- S등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- A등급 (파이파이) -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1536.png"><div class="t-name">묘권왕 파이파이DX</div></div>
                </div>
            </div>

            <!-- B등급 (사쿠라, 엠마) -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1737.png"><div class="t-name">천주Z 사쿠라</div></div>
                    <div class="t-card"><img src="IMG_1553.png"><div class="t-name">염라 대장 엠마</div></div>
                </div>
            </div>

            <!-- C등급 (레이, 시리우스) -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1736.png"><div class="t-name">광전휘병 윙 레이</div></div>
                    <div class="t-card"><img src="IMG_1739.png"><div class="t-name">광명의 여신 시리우스</div></div>
                </div>
            </div>

            <!-- D등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area"></div>
            </div>
        </div>
    </div>

    <!-- 검색 전용 숨김 키워드 리스트 -->
    <div style="display: none;">
        <div class="t-name">묘권왕 파이파이DX</div>
        <div class="t-name">염라 대장 엠마</div>
        <div class="t-name">광전휘병 윙 레이</div>
        <div class="t-name">천주Z 사쿠라</div>
        <div class="t-name">광명의 여신 시리우스</div>

        <div class="t-name">묘반권 파이파이</div>
        <div class="t-name">묘반권 파이파이Z</div>

        <div class="t-name">광전기병 레이</div>
        <div class="t-name">광전기병 플라즈마 레이</div>

        <div class="t-name">사쿠라</div>
        <div class="t-name">JK사쿠라</div>
        <div class="t-name">천주 사쿠라</div>

        <div class="t-name">지옥 경찰 엠마</div>
        <div class="t-name">지옥 중사 엠마</div>

        <div class="t-name">빛의 여신 시리우스</div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'bustersFrame', height: currentHeight }, '*');
        }

        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);

        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');

            setTimeout(sendHeight, 50);
            setTimeout(sendHeight, 300);
        }
    </script>
</body>
</html>
