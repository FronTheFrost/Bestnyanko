<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이너마이트 군단 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.25s ease-out;
        }
        .tier-content-wrapper.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
            white-space: normal;
            overflow: visible;
        }
    </style>
</head>
<body>

    <!-- 다이너마이트 군단 배너 -->
    <div class="tier-banner" onclick="toggleTierList(this)">
        <img src="IMG_1601.jpeg" alt="다이너마이트 군단 배너">
    </div>

    <!-- 펼쳐질 티어표 내용 -->
    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dagun/IMG_1584.png"><div class="t-name">헬파이어 도깨비 야옹마</div></div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dagun/IMG_1526.png"><div class="t-name">고양이 파라딘</div></div>
                    <div class="t-card"><img src="dagun/IMG_1538.png"><div class="t-name">고양이 머신・멸</div></div>
                    <div class="t-card"><img src="dagun/IMG_1610.png"><div class="t-name">신 라스트 보스</div></div>
                    <div class="t-card"><img src="dagun/IMG_1615.png"><div class="t-name">스타라이트 모모코</div></div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dagun/IMG_1607.png"><div class="t-name">고양이 베이비월드</div></div>
                    <div class="t-card"><img src="dagun/IMG_1611.png"><div class="t-name">데빌 헌터 사토루</div></div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dagun/IMG_1564.png"><div class="t-name">날아라 변신 소녀 단</div></div>
                    <div class="t-card"><img src="dagun/IMG_1603.png"><div class="t-name">고양이 아이스 크리스탈</div></div>
                    <div class="t-card"><img src="dagun/IMG_1609.png"><div class="t-name">고양이 퀘스트 헤븐</div></div>
                    <div class="t-card"><img src="dagun/IMG_1613.png"><div class="t-name">메카 고양이 다이너사우루스</div></div>
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dagun/IMG_1608.png"><div class="t-name">조이풀 고양이 간호사</div></div>
                    <div class="t-card"><img src="dagun/IMG_1612.png"><div class="t-name">대신선 고양이 텐구</div></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleTierList(element) {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');
            element.blur();
        }
    </script>
</body>
</html>
