<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="냥코대전쟁 캐릭터 가이드">
    <meta property="og:description" content="속성별 딜러/탱커 추천 및 냥콤보 가이드">
    <meta property="og:image" content="https://raw.githubusercontent.com/FronTheFrost/Bestnyanko/main/image_800x420.png">
    <title>냥코대전쟁 캐릭터 가이드</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --box-bg: #282828;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: inline-block;
            width: 100%;
        }

        h1:active { transform: scale(0.95); }

        .main-tab-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }

        .main-tab-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 4px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .main-tab-btn:hover {
            border-color: #666;
            color: #fff;
            background-color: #252525;
        }

        .main-tab-btn.active {
            border-color: var(--accent-color);
            background-color: #2a2a24;
            color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.25);
        }

        .main-section { display: none; }
        .main-section.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-frame {
            width: 100%;
            border: none;
            background: transparent;
            overflow: hidden;
            transition: height 0.25s ease;
        }

        .ee-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .ee-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ee-modal-content {
            background: #1e1e1e;
            color: #ffffff;
            border: 2px solid #ffcc00;
            border-radius: 14px;
            padding: 24px;
            max-width: 360px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 204, 0, 0.25);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ee-modal-overlay.active .ee-modal-content { transform: scale(1); }

        .ee-modal-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffcc00;
            margin-bottom: 12px;
        }

        .ee-modal-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .ee-modal-btn {
            background: #ffcc00;
            color: #121212;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .giant-egg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .giant-egg-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .giant-egg-box {
            text-align: center;
            transform: scale(0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%;
            max-width: 480px;
            padding: 10px;
        }

        .giant-egg-overlay.active .giant-egg-box { transform: scale(1); }

        .giant-egg-img {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 20px;
            border: 6px solid #ffcc00;
            box-shadow: 0 0 70px rgba(255, 204, 0, 0.7);
            margin-bottom: 25px;
        }

        .giant-egg-text {
            font-size: 26px;
            font-weight: 900;
            color: #ffcc00;
            margin-bottom: 30px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .giant-egg-close-btn {
            background: #ffcc00;
            color: #121212;
            border: none;
            padding: 14px 44px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1 id="mainTitle" onclick="handleTitleClick()">냥코대전쟁 캐릭터 가이드</h1>

    <div class="main-tab-container">
        <button class="main-tab-btn active" onclick="switchMainTab('attribute-section', this)">속성별 가이드</button>
        <button class="main-tab-btn" onclick="switchMainTab('rush-section', this)">속공 및 범용</button>
        <button class="main-tab-btn" onclick="switchMainTab('growth-section', this)">추천 4진/초본</button>
        <button class="main-tab-btn" onclick="switchMainTab('deck-section', this)">범용 편성 모음</button>
        <button class="main-tab-btn" onclick="switchMainTab('combo-section', this)">냥콤보 best 8</button>
        <button class="main-tab-btn" onclick="switchMainTab('tier-section', this)">시리즈별 티어표</button>
    </div>

    <div id="attribute-section" class="main-section active">
        <iframe src="attribute.html" class="tab-frame" style="height: 420px;" scrolling="auto"></iframe>
    </div>

    <div id="rush-section" class="main-section">
        <iframe src="rush.html" class="tab-frame" style="height: 2200px;" scrolling="auto"></iframe>
    </div>

    <div id="growth-section" class="main-section">
        <iframe src="growth.html" class="tab-frame" style="height: 350px;" scrolling="auto"></iframe>
    </div>

    <div id="deck-section" class="main-section">
        <iframe src="deck.html" class="tab-frame" style="height: 750px;" scrolling="auto"></iframe>
    </div>

    <div id="combo-section" class="main-section">
        <iframe src="combo.html" class="tab-frame" style="height: 1200px;" scrolling="auto"></iframe>
    </div>

    <!-- [섹션 6] 시리즈별 티어표 탭 (초기 높이를 250px로 주어 배너 잘림 방지) -->
    <div id="tier-section" class="main-section">
        <div style="max-width: 650px; width: 100%; margin: 0 auto 30px auto; display: flex; flex-direction: column; gap: 15px;">
            <iframe src="dagun.html" id="dagunFrame" class="tab-frame" style="height: 250px;" scrolling="no"></iframe>
            <iframe src="basar.html" id="basarFrame" class="tab-frame" style="height: 250px;" scrolling="no"></iframe>
        </div>
    </div>

    <div class="ee-modal-overlay" id="eeModalOverlay" onclick="closeEeModal(event)">
        <div class="ee-modal-content" onclick="event.stopPropagation()">
            <div class="ee-modal-title" id="eeModalTitle">[숨겨진 이스터에그 발견]</div>
            <div class="ee-modal-body" id="eeModalBody">내용</div>
            <button class="ee-modal-btn" onclick="closeEeModal()">확인</button>
        </div>
    </div>

    <div class="giant-egg-overlay" id="giantEggOverlay" onclick="closeGiantEgg()">
        <div class="giant-egg-box" onclick="event.stopPropagation()">
            <img src="IMG_1593.png" class="giant-egg-img">
            <div class="giant-egg-text">고양이 에그</div>
            <button class="giant-egg-close-btn" onclick="closeGiantEgg()">닫기</button>
        </div>
    </div>

    <script>
        let titleClickCount = 0;
        window.foundEggOrder = [];

        function switchMainTab(sectionId, btnElement) {
            document.querySelectorAll('.main-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            btnElement.classList.add('active');
        }

        // 아이프레임(티어표) 내부에서 배너가 눌릴 때 실시간으로 높이를 전달받아 조절
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resizeHeight') {
                const iframe = document.getElementById(event.data.id);
                if (iframe) {
                    iframe.style.height = event.data.height + 'px';
                }
            }
        });

        window.registerEggAndGetIndex = function(eggKey) {
            if (!window.foundEggOrder.includes(eggKey)) {
                window.foundEggOrder.push(eggKey);
            }
            return window.foundEggOrder.indexOf(eggKey) + 1;
        };

        window.openGlobalEeModal = function(eggKey, tmiText) {
            const indexNum = window.registerEggAndGetIndex(eggKey);
            document.getElementById('eeModalTitle').innerText = `[숨겨진 이스터에그 발견 (${indexNum}/3)]`;
            document.getElementById('eeModalBody').innerText = tmiText;
            document.getElementById('eeModalOverlay').classList.add('active');
        };

        function closeEeModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('eeModalOverlay').classList.remove('active');
        }

        function handleTitleClick() {
            const titleEl = document.getElementById('mainTitle');
            titleClickCount++;

            let currentScale = 1 + (titleClickCount * 0.07);
            if (currentScale > 1.35) currentScale = 1.35;
            titleEl.style.transform = `scale(${currentScale})`;

            if (titleClickCount >= 5) {
                document.getElementById('giantEggOverlay').classList.add('active');
                titleEl.innerText = "고양이 에그";
                titleEl.style.transform = "scale(1)";
            }
        }

        function closeGiantEgg() {
            document.getElementById('giantEggOverlay').classList.remove('active');
            window.openGlobalEeModal('title', "비 오는 날은 파전이 최고입니다.");
        }
    </script>
</body>
</html>
