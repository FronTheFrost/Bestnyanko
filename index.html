<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="냥코대전쟁 캐릭터 가이드">
    <meta property="og:description" content="속성별 딜러/탱커 추천 및 냥콤보 가이드">
    <meta property="og:image" content="https://raw.githubusercontent.com/FronTheFrost/Bestnyanko/main/IMG_1659.jpeg">
    <title>냥코대전쟁 캐릭터 가이드</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --box-bg: #282828;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: inline-block;
            width: 100%;
        }

        h1:active { transform: scale(0.95); }

        .main-tab-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }

        .main-tab-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 4px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .main-tab-btn:hover {
            border-color: #666;
            color: #fff;
            background-color: #252525;
        }

        .main-tab-btn.active {
            border-color: var(--accent-color);
            background-color: #2a2a24;
            color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.25);
        }

        .main-section { display: none; }
        .main-section.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-frame {
            width: 100%;
            border: none;
            background: transparent;
            overflow: hidden;
            transition: height 0.25s ease;
        }

        /* --- 6번 탭 상단 검색창 (Sticky) --- */
        .tier-search-container {
            position: sticky;
            top: 10px;
            z-index: 999;
            width: 100%;
            margin-bottom: 20px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(5px);
            padding: 5px 0;
        }

        .search-box-wrapper {
            display: flex;
            gap: 6px;
        }

        .search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .search-btn {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .search-btn:hover {
            background-color: #e6b800;
        }

        .autocomplete-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background-color: #222222;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin: 0;
            padding: 4px 0;
            list-style: none;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            color: #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background-color: #333333;
            color: var(--accent-color);
        }

        .matched-chars {
            font-size: 11px;
            color: #888;
            margin-left: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .ee-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .ee-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ee-modal-content {
            background: #1e1e1e;
            color: #ffffff;
            border: 2px solid #ffcc00;
            border-radius: 14px;
            padding: 24px;
            max-width: 360px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 204, 0, 0.25);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ee-modal-overlay.active .ee-modal-content { transform: scale(1); }

        .ee-modal-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffcc00;
            margin-bottom: 12px;
        }

        .ee-modal-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .ee-modal-btn {
            background: #ffcc00;
            color: #121212;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .giant-egg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .giant-egg-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .giant-egg-box {
            text-align: center;
            transform: scale(0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%;
            max-width: 480px;
            padding: 10px;
        }

        .giant-egg-overlay.active .giant-egg-box { transform: scale(1); }

        .giant-egg-img {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 20px;
            border: 6px solid #ffcc00;
            box-shadow: 0 0 70px rgba(255, 204, 0, 0.7);
            margin-bottom: 25px;
        }

        .giant-egg-text {
            font-size: 26px;
            font-weight: 900;
            color: #ffcc00;
            margin-bottom: 30px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .giant-egg-close-btn {
            background: #ffcc00;
            color: #121212;
            border: none;
            padding: 14px 44px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1 id="mainTitle" onclick="handleTitleClick()">냥코대전쟁 캐릭터 가이드</h1>

    <div class="main-tab-container">
        <button class="main-tab-btn active" onclick="switchMainTab('attribute-section', this)">속성별 가이드</button>
        <button class="main-tab-btn" onclick="switchMainTab('rush-section', this)">속공 및 범용</button>
        <button class="main-tab-btn" onclick="switchMainTab('growth-section', this)">추천 4진/초본</button>
        <button class="main-tab-btn" onclick="switchMainTab('deck-section', this)">범용 편성 모음</button>
        <button class="main-tab-btn" onclick="switchMainTab('combo-section', this)">냥콤보 best 8</button>
        <button class="main-tab-btn" id="tierTabBtn" onclick="switchMainTab('tier-section', this)">시리즈별 티어표</button>
    </div>

    <div id="attribute-section" class="main-section">
        <iframe src="attribute.html" id="attrFrame" class="tab-frame" style="height: 600px;" scrolling="no"></iframe>
    </div>

    <div id="rush-section" class="main-section">
        <iframe src="rush.html" id="rushFrame" class="tab-frame" style="height: 1200px;" scrolling="no"></iframe>
    </div>

    <div id="growth-section" class="main-section">
        <iframe src="growth.html" id="growthFrame" class="tab-frame" style="height: 500px;" scrolling="no"></iframe>
    </div>

    <div id="deck-section" class="main-section">
        <iframe src="deck.html" id="deckFrame" class="tab-frame" style="height: 850px;" scrolling="no"></iframe>
    </div>

    <div id="combo-section" class="main-section">
        <iframe src="combo.html" id="comboFrame" class="tab-frame" style="height: 1300px;" scrolling="no"></iframe>
    </div>

    <!-- [섹션 6] 시리즈별 티어표 탭 -->
    <div id="tier-section" class="main-section active">
        <div style="max-width: 650px; width: 100%; margin: 0 auto 30px auto; display: flex; flex-direction: column;">
            
            <div class="tier-search-container">
                <div class="search-box-wrapper">
                    <input type="text" id="searchInput" class="search-input" placeholder="시리즈명 또는 캐릭터 검색 (예: 드엠, 테라볼타, 볼)" autocomplete="off">
                    <button class="search-btn" onclick="executeSearch()">검색</button>
                </div>
                <ul id="autocompleteList" class="autocomplete-list"></ul>
            </div>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <iframe src="dagun/dagun.html" id="dagunFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="basar/basar.html" id="basarFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="galaxy/galaxy.html" id="galaxyFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="dragon/dragon.html" id="dragonFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="souls/souls.html" id="soulsFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="heroes/heroes.html" id="heroesFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="zeus/zeus.html" id="zeusFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="iron/iron.html" id="ironFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="pixies/pixies.html" id="pixiesFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="monsters/monsters.html" id="monstersFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
                <iframe src="luga/luga.html" id="lugaFrame" class="tab-frame" style="height: 200px;" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <div class="ee-modal-overlay" id="eeModalOverlay" onclick="closeEeModal(event)">
        <div class="ee-modal-content" onclick="event.stopPropagation()">
            <div class="ee-modal-title" id="eeModalTitle">[숨겨진 이스터에그 발견]</div>
            <div class="ee-modal-body" id="eeModalBody">내용</div>
            <button class="ee-modal-btn" onclick="closeEeModal()">확인</button>
        </div>
    </div>

    <div class="giant-egg-overlay" id="giantEggOverlay" onclick="closeGiantEgg()">
        <div class="giant-egg-box" onclick="event.stopPropagation()">
            <img src="IMG_1593.png" class="giant-egg-img">
            <div class="giant-egg-text">고양이 에그</div>
            <button class="giant-egg-close-btn" onclick="closeGiantEgg()">닫기</button>
        </div>
    </div>

    <script>
        let titleClickCount = 0;
        window.foundEggOrder = [];

        // --- 티어표 데이터베이스 (시리즈 기본 정보 및 줄임말만 정의) ---
        const tierSeriesData = [
            { id: "dagunFrame", title: "전설의 고양이 다군", alias: ["다군"], characters: [] },
            { id: "basarFrame", title: "바사라즈", alias: ["바사라", "전국무장 바사라즈"], characters: [] },
            { id: "galaxyFrame", title: "갤러시걸즈", alias: ["갤걸", "전뇌학원 갤러시걸즈"], characters: [] },
            { id: "dragonFrame", title: "초파괴전함 드래곤 엠퍼러즈", alias: ["드엠", "드래곤 엠퍼러즈"], characters: [] },
            { id: "soulsFrame", title: "울트라 소울즈", alias: ["울소", "울트라소울즈"], characters: [] },
            { id: "heroesFrame", title: "다크 히어로즈", alias: ["다히", "다크히어로즈"], characters: [] },
            { id: "zeusFrame", title: "기간트 제우스", alias: ["제우스", "알수없는 기간트 제우스"], characters: [] },
            { id: "ironFrame", title: "혁명군 아이언 워스", alias: ["아이언워스", "아워"], characters: [] },
            { id: "pixiesFrame", title: "대정령 엘리멘탈 픽시즈", alias: ["픽시즈", "엘리멘탈 픽시즈"], characters: [] },
            { id: "monstersFrame", title: "몬스터 걸즈", alias: ["몬걸", "몬스터걸즈"], characters: [] },
            { id: "lugaFrame", title: "초고대 전설 루가족", alias: ["루가족", "루가"], characters: [] }
        ];

        // --- 아이프레임 내부에서 캐릭터 이름을 자동으로 수집하는 함수 ---
        function collectCharactersFromIframes() {
            tierSeriesData.forEach(item => {
                const iframe = document.getElementById(item.id);
                if (iframe) {
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc) {
                            const nameEls = iframeDoc.querySelectorAll('.t-name');
                            const charList = [];
                            nameEls.forEach(el => {
                                const text = el.innerText.trim();
                                if (text && !charList.includes(text)) {
                                    charList.push(text);
                                }
                            });
                            item.characters = charList;
                        }
                    } catch (e) {
                        // 로컬 보안 제약(CORS)이나 아직 로드되지 않은 경우 예외 처리
                    }
                }
            });
        }

        // 각 아이프레임이 로드될 때마다 해당 아이프레임 캐릭터 목록 자동 동기화
        document.querySelectorAll('.tab-frame').forEach(iframe => {
            iframe.addEventListener('load', () => {
                collectCharactersFromIframes();
            });
        });

        function switchMainTab(sectionId, btnElement) {
            document.querySelectorAll('.main-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 검색 및 추천 검색어 자동완성 로직 ---
        const searchInput = document.getElementById('searchInput');
        const autoList = document.getElementById('autocompleteList');

        searchInput.addEventListener('input', function() {
            // 검색 전 최신 캐릭터 목록 동기화
            collectCharactersFromIframes();

            const query = this.value.trim().toLowerCase();
            autoList.innerHTML = '';

            if (!query) {
                autoList.style.display = 'none';
                return;
            }

            const results = [];

            tierSeriesData.forEach(item => {
                const titleMatch = item.title.toLowerCase().includes(query);
                const aliasMatch = item.alias && item.alias.some(a => a.toLowerCase().includes(query));
                const matchedChars = item.characters.filter(char => char.toLowerCase().includes(query));

                if (titleMatch || aliasMatch || matchedChars.length > 0) {
                    results.push({
                        series: item,
                        matchedChars: matchedChars
                    });
                }
            });

            if (results.length > 0) {
                results.forEach(res => {
                    const li = document.createElement('li');
                    li.className = 'autocomplete-item';

                    let charText = res.matchedChars.length > 0 ? `(${res.matchedChars.join(', ')})` : '';

                    li.innerHTML = `
                        <span><strong>${res.series.title}</strong></span>
                        <span class="matched-chars">${charText}</span>
                    `;

                    li.addEventListener('click', () => {
                        selectAndNavigateSeries(res.series);
                    });

                    autoList.appendChild(li);
                });
                autoList.style.display = 'block';
            } else {
                autoList.style.display = 'none';
            }
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });

        function executeSearch() {
            collectCharactersFromIframes();
            const query = searchInput.value.trim().toLowerCase();
            if (!query) return;

            const matched = tierSeriesData.find(item => {
                const titleMatch = item.title.toLowerCase().includes(query);
                const aliasMatch = item.alias && item.alias.some(a => a.toLowerCase().includes(query));
                const charMatch = item.characters.some(char => char.toLowerCase().includes(query));
                return titleMatch || aliasMatch || charMatch;
            });

            if (matched) {
                selectAndNavigateSeries(matched);
            } else {
                alert("일치하는 시리즈나 캐릭터를 찾을 수 없습니다.");
            }
        }

        function selectAndNavigateSeries(series) {
            searchInput.value = '';
            autoList.style.display = 'none';

            const targetIframe = document.getElementById(series.id);
            if (targetIframe) {
                targetIframe.scrollIntoView({ behavior: 'smooth', block: 'center' });

                try {
                    if (targetIframe.contentWindow && typeof targetIframe.contentWindow.toggleTierList === 'function') {
                        const content = targetIframe.contentWindow.document.getElementById('tierContent');
                        if (content && !content.classList.contains('active')) {
                            targetIframe.contentWindow.toggleTierList();
                        }
                    }
                } catch (e) {
                    console.log("Iframe cross-origin limitation or function missing", e);
                }
            }
        }

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !autoList.contains(e.target)) {
                autoList.style.display = 'none';
            }
        });

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resizeHeight') {
                const iframe = document.getElementById(event.data.id);
                if (iframe) {
                    iframe.style.height = event.data.height + 'px';
                }
            }
        });

        window.registerEggAndGetIndex = function(eggKey) {
            if (!window.foundEggOrder.includes(eggKey)) {
                window.foundEggOrder.push(eggKey);
            }
            return window.foundEggOrder.indexOf(eggKey) + 1;
        };

        window.openGlobalEeModal = function(eggKey, tmiText) {
            const indexNum = window.registerEggAndGetIndex(eggKey);
            document.getElementById('eeModalTitle').innerText = `[숨겨진 이스터에그 발견 (${indexNum}/3)]`;
            document.getElementById('eeModalBody').innerText = tmiText;
            document.getElementById('eeModalOverlay').classList.add('active');
        };

        function closeEeModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('eeModalOverlay').classList.remove('active');
        }

        function handleTitleClick() {
            const titleEl = document.getElementById('mainTitle');
            titleClickCount++;

            let currentScale = 1 + (titleClickCount * 0.07);
            if (currentScale > 1.35) currentScale = 1.35;
            titleEl.style.transform = `scale(${currentScale})`;

            if (titleClickCount >= 5) {
                document.getElementById('giantEggOverlay').classList.add('active');
                titleEl.innerText = "고양이 에그";
                titleEl.style.transform = "scale(1)";
            }
        }

        function closeGiantEgg() {
            document.getElementById('giantEggOverlay').classList.remove('active');
            window.openGlobalEeModal('title', "비 오는 날은 파전이 최고입니다.");
        }
    </script>
</body>
</html>
