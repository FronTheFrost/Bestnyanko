<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥코대전쟁 시리즈별 티어표 - 초환수 바사라즈</title>
    <style>
        :root {
            --bg-color: #282828;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 상단 배너 (노란 테두리 잔상 완전 차단) */
        .tier-banner {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
        }
        .tier-banner:focus, .tier-banner:active {
            outline: none !important;
            border-color: var(--border-color) !important;
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        /* 티어표 전체 컨테이너 */
        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.25s ease-out;
        }
        .tier-content-wrapper.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 티어 등급 행 */
        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        /* SS ~ D 등급별 색상 분기 */
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        /* 캐릭터 미니 카드 */
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
            white-space: normal;
            overflow: visible;
        }
    </style>
</head>
<body>

    <!-- 상단 시리즈 배너 이미지 -->
    <div class="tier-banner" id="tierBanner" onclick="toggleTierList(this)">
        <img src="IMG_1617.jpeg" alt="초환수 바사라즈 배너">
    </div>

    <!-- 배너를 눌렀을 때 나타나는 티어표 영역 (SS ~ D) -->
    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            
            <!-- SS 등급 -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area">
                    <!-- 없음 -->
                </div>
            </div>

            <!-- S 등급 -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="basar/IMG_1519.png"><div class="t-name">비약의 무신・그리폰</div></div>
                </div>
            </div>

            <!-- A 등급 -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="basar/IMG_1541.png"><div class="t-name">진노의 백호</div></div>
                    <div class="t-card"><img src="basar/IMG_1531.png"><div class="t-name">절영의 흑표</div></div>
                    <div class="t-card"><img src="basar/IMG_1591.png"><div class="t-name">연옥무쌍 미네르바</div></div>
                </div>
            </div>

            <!-- B 등급 -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <!-- 없음 -->
                </div>
            </div>

            <!-- C 등급 -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <!-- 없음 -->
                </div>
            </div>

            <!-- D 등급 -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <!-- 없음 -->
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleTierList(element) {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');
            
            // 터치 후 노란 테두리 잔상 방지를 위한 포커스 해제
            element.blur();
        }
    </script>

</body>
</html>
