<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추천 4진 및 초본</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --box-bg: #282828;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 10px 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: visible !important;
        }

        .box-container {
            max-width: 650px;
            margin: 0 auto 30px auto;
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .section-title {
            color: #ffffff;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
            margin-top: 16px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .section-title:first-of-type { margin-top: 0; }

        .character-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .character-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 2px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-width: 0;
        }

        .rank-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background-color: rgba(0, 0, 0, 0.75);
            color: var(--accent-color);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        .char-img {
            width: 100%;
            max-width: 104px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 4px;
            background-color: #000;
        }

        .char-name {
            font-size: 10px;
            margin-top: 5px;
            font-weight: 600;
            word-break: break-all;
            color: #ddd;
            line-height: 1.2;
            width: 100%;
            overflow: hidden;
        }

        .link-btn-container {
            display: flex;
            gap: 12px;
            max-width: 500px;
            margin: 35px auto 15px auto;
        }

        .link-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .youtube-btn {
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.25);
        }

        .kakao-btn {
            background: linear-gradient(135deg, #ffe812 0%, #f7c600 100%);
            color: #222222;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 15px rgba(254, 229, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="box-container">
        <div class="section-title" style="margin-top: 0;">추천 4단 진화 Top 5</div>
        <div class="character-row" style="margin-bottom: 20px;">
            <div class="character-card"><div class="rank-badge">1위</div><img src="IMG_1568.png" class="char-img"><div class="char-name">울트라 석공 냥돌이</div></div>
            <div class="character-card"><div class="rank-badge">2위</div><img src="IMG_1533.png" class="char-img"><div class="char-name">얼티밋・산디아β</div></div>
            <div class="character-card"><div class="rank-badge">3위</div><img src="IMG_1592.png" class="char-img"><div class="char-name">스펙트르 캣</div></div>
            <div class="character-card"><div class="rank-badge">4위</div><img src="IMG_1523.png" class="char-img"><div class="char-name">울트라 대나무 공주</div></div>
            <div class="character-card"><div class="rank-badge">5위</div><img src="IMG_1591.png" class="char-img"><div class="char-name">연옥무쌍 미네르바</div></div>
        </div>

        <div class="section-title">추천 초본능 Top 5</div>
        <div class="character-row">
            <div class="character-card"><div class="rank-badge">1위</div><img src="IMG_1491.png" class="char-img"><div class="char-name">G데스 하데스</div></div>
            <div class="character-card"><div class="rank-badge">2위</div><img src="IMG_1496.png" class="char-img"><div class="char-name">섬멸 송골매</div></div>
            <div class="character-card"><div class="rank-badge">3위</div><img src="IMG_1545.png" class="char-img"><div class="char-name">쌍둥이별 시시루와 코마리Φ</div></div>
            <div class="character-card"><div class="rank-badge">4위</div><img src="IMG_1554.png" class="char-img"><div class="char-name">황금의 미라공주 레이카</div></div>
            <div class="character-card"><div class="rank-badge">5위</div><img src="IMG_1514.png" class="char-img"><div class="char-name">슈퍼 카이μ</div></div>
        </div>
    </div>

    <div class="link-btn-container">
        <a href="https://www.youtube.com/@미사카미코토" target="_blank" class="link-btn youtube-btn">▶ 디디잇 유튜브 구독</a>
        <a href="https://open.kakao.com/o/pHG8yJOi" target="_blank" class="link-btn kakao-btn">💬 냥코 연구소 오픈채팅방</a>
    </div>

    <script>
        // 콘텐츠 높이 자동 동기화
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'growthFrame', height: currentHeight }, '*');
        }

        const observer = new ResizeObserver(() => { sendHeight(); });
        observer.observe(document.body);
        window.addEventListener('load', sendHeight);
    </script>
</body>
</html>
