<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 작성/수정</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Quill 에디터 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 💡 body에 하단 여유 공간을 넉넉히 주어 스크롤이 바닥까지 확실히 내려가게 함 */
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; padding-bottom: 80px; }
        
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        
        h1 { font-size: 22px; margin-bottom: 20px; color: #38bdf8; text-align: center; }
        
        input { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
        
        /* 💡 버튼 영역이 아래에서 확실히 보이도록 마진 확보 */
        .submit-btn-wrap { margin-top: 30px; margin-bottom: 20px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 14px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; font-size: 16px; }
        button:hover { background: #0ea5e9; }
        
        .ql-toolbar.ql-snow { background: #1e293b; border-color: #475569 !important; border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .ql-container.ql-snow { background: #0f172a; border-color: #475569 !important; color: #fff; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; font-size: 15px; }
        
        /* 💡 에디터 최소 높이를 주고, 글이 길어지면 자연스럽게 늘어나도록 설정 */
        .ql-editor { min-height: 400px; color: #fff; }

        /* 이미지는 크기만 조절되고 사용자가 선택한 정렬(좌·중·우)을 따름 */
        .ql-editor img {
            max-width: 60% !important;
            height: auto !important;
            display: block;
        }
        
        .ql-snow .ql-stroke { stroke: #cbd5e1; }
        .ql-snow .ql-fill { fill: #cbd5e1; }
        .ql-snow .ql-picker { color: #cbd5e1; }

        .helper-text { font-size: 12px; color: #38bdf8; background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed #334155; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <a href="review.html" class="back-link">← 목록으로 돌아가기</a>
    <h1 id="page-heading">새 리뷰 작성</h1>
    
    <input type="text" id="review-title" placeholder="제목을 입력하세요">
    <input type="text" id="review-author" placeholder="작성자" value="관리자">
    
    <div class="helper-text">
        💡 <strong>사진 첨부 요령:</strong> 본문 중간에 커서를 두고 그림 아이콘을 누르면 사진이 들어갑니다. 상단 정렬 버튼으로 위치를 조절할 수 있어요!
    </div>
    
    <div id="editor-container" style="margin-bottom: 10px;"></div>
    
    <div class="submit-btn-wrap">
        <button onclick="submitReview()" id="submit-btn">리뷰 등록하기</button>
    </div>
</div>

<!-- Quill 에디터 JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
    const SUPABASE_URL = 'https://vvbqjwbvqpppkmhnntlw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pcyr0OE4Tlaaa2Bh9BS_rg_7hpBwdmd';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let quill;
    let savedRange = null;

    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const reviewId = Number(urlParams.get('id'));

    window.onload = async function() {
        window.scrollTo(0, 0); // 작성 페이지 진입 시 맨 위로 스크롤 고정

        if (localStorage.getItem('isAdminAuth') !== 'true') {
            alert('관리자 전용 페이지입니다.');
            location.href = 'review.html';
            return;
        }

        quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ header: [1, 2, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ align: [] }], // 정렬 버튼 (좌, 중앙, 우, 양쪽)
                    ['blockquote', 'code-block'],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    ['link', 'image', 'video'],
                    ['clean']
                ]
            }
        });

        quill.on('selection-change', function(range) {
            if (range) {
                savedRange = range;
            }
        });

        const toolbar = quill.getModule('toolbar');
        toolbar.addHandler('image', selectMultipleImages);

        if (mode === 'edit' && reviewId) {
            document.getElementById('page-heading').innerText = '리뷰 수정하기';
            document.getElementById('submit-btn').innerText = '수정 완료하기';
            await loadExistingData(reviewId);
        }
    };

    function selectMultipleImages() {
        let range = quill.getSelection();
        if (range) {
            savedRange = range;
        }

        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.setAttribute('multiple', 'true');
        input.click();

        input.onchange = async () => {
            const files = input.files;
            if (!files || files.length === 0) return;

            let cursorIndex = savedRange ? savedRange.index : quill.getLength();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = `${Date.now()}_${i}_${file.name}`;
                
                const { data, error } = await supabaseClient.storage
                    .from('review-images')
                    .upload(fileName, file);

                if (error) {
                    alert(`이미지(${file.name}) 업로드 실패: ` + error.message);
                    continue;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('review-images')
                    .getPublicUrl(fileName);

                const imageUrl = publicUrlData.publicUrl;

                quill.insertEmbed(cursorIndex, 'image', imageUrl);
                cursorIndex += 1;
            }
            
            quill.setSelection(cursorIndex);
            savedRange = { index: cursorIndex, length: 0 };
        };
    }

    async function loadExistingData(id) {
        const { data, error } = await supabaseClient
            .from('reviews')
            .select('*')
            .eq('id', id)
            .single();

        if (error || !data) {
            alert('기존 리뷰를 불러오지 못했습니다.');
            location.href = 'review.html';
            return;
        }

        document.getElementById('review-title').value = data.title;
        document.getElementById('review-author').value = data.author || '관리자';
        quill.root.innerHTML = data.content;
    }

    async function submitReview() {
        const title = document.getElementById('review-title').value.trim();
        const author = document.getElementById('review-author').value;
        const content = quill.root.innerHTML;
        
        const textLength = quill.getText().trim().length;
        const hasImages = content.includes('<img');

        if (!title || (textLength === 0 && !hasImages)) {
            alert('제목과 내용을 모두 입력해주세요.');
            return;
        }

        if (mode === 'edit' && reviewId) {
            const { error } = await supabaseClient
                .from('reviews')
                .update({ title, author: author || '관리자', content })
                .eq('id', reviewId);

            if (error) {
                alert('수정 실패: ' + error.message);
                return;
            }
            alert('리뷰가 성공적으로 수정되었습니다!');
            location.href = `review_detail.html?id=${reviewId}`;
        } else {
            const { error } = await supabaseClient
                .from('reviews')
                .insert([{ title, author: author || '관리자', content }]);

            if (error) {
                alert('등록 실패: ' + error.message);
                return;
            }
            alert('새 리뷰가 등록되었습니다!');
            location.href = 'review.html';
        }
    }
</script>

</body>
</html>
