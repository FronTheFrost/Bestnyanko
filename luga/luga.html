<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전설의 고양이 루가족 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
        }
        .tier-content-wrapper.active {
            display: block !important;
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            min-height: 48px;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.sss { background: #6c5ce7; }
        .tier-label.ss  { background: #b82323; }
        .tier-label.s   { background: #b8621b; }
        .tier-label.a   { background: #b89d1b; color: #121212; }
        .tier-label.b   { background: #337d33; }
        .tier-label.c   { background: #236ab8; }
        .tier-label.d   { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <!-- 루가족 배너 (Raw 절대 주소 적용) -->
    <div class="tier-banner" onclick="toggleTierList()">
        <img src="https://raw.githubusercontent.com/FronTheFrost/Bestnyanko/main/IMG_1637.webp" alt="전설의 고양이 루가족 배너">
    </div>

    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- SSS등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label sss">SSS</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- SS등급 (카오란타타란) -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1731.png"><div class="t-name">카오란타타란</div></div>
                </div>
            </div>

            <!-- S등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- A등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- B등급 (쿠비란, 테사란, 극대노) -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1724.png"><div class="t-name">E・쿠비란파사란</div></div>
                    <div class="t-card"><img src="IMG_1725.png"><div class="t-name">밀짚모자 테사란</div></div>
                    <div class="t-card"><img src="IMG_1730.png"><div class="t-name">극대노 파사란</div></div>
                </div>
            </div>

            <!-- C등급 (케사란, 아시란, 바라란, 레제란) -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1722.png"><div class="t-name">울트라 케사란</div></div>
                    <div class="t-card"><img src="IMG_1723.png"><div class="t-name">아타타타아시란</div></div>
                    <div class="t-card"><img src="IMG_1733.png"><div class="t-name">피카란바라란</div></div>
                    <div class="t-card"><img src="IMG_1728.png"><div class="t-name">레제란 파사란</div></div>
                </div>
            </div>

            <!-- D등급 (가시란, 노비란, 스케란, 마모란) -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1726.png"><div class="t-name">가시란시시가미</div></div>
                    <div class="t-card"><img src="IMG_1727.png"><div class="t-name">노비란 터번</div></div>
                    <div class="t-card"><img src="IMG_1729.png"><div class="t-name">스케란카쿠란</div></div>
                    <div class="t-card"><img src="IMG_1732.png"><div class="t-name">마모란파사란</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 검색 전용 숨김 키워드 리스트 -->
    <div style="display: none;">
        <div class="t-name">고양이 루가</div>
        <div class="t-name">케사란파사란</div>

        <div class="t-name">아시루가</div>
        <div class="t-name">아시란파사란</div>

        <div class="t-name">쿠비루가</div>
        <div class="t-name">쿠비란파사란</div>

        <div class="t-name">테코루가</div>
        <div class="t-name">테사란파사란</div>

        <div class="t-name">바라라가</div>
        <div class="t-name">바라란파사란</div>

        <div class="t-name">가시루가</div>
        <div class="t-name">가시란시시가미</div>

        <div class="t-name">노비루가</div>
        <div class="t-name">노비란 터번</div>

        <div class="t-name">오이루가</div>
        <div class="t-name">오이란파사란</div>

        <div class="t-name">오코루가</div>
        <div class="t-name">오코란파사란</div>

        <div class="t-name">카오루가</div>
        <div class="t-name">카오란타타란</div>

        <div class="t-name">마모루가</div>

        <div class="t-name">레제루가</div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'lugaFrame', height: currentHeight }, '*');
        }

        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);

        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');

            setTimeout(sendHeight, 50);
            setTimeout(sendHeight, 300);
        }
    </script>
</body>
</html>
