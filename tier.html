<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥코대전쟁 시리즈별 티어표</title>
    <style>
        :root {
            --bg-color: #282828;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
        }
        /* 상단 배너 */
        .tier-banner {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            margin-bottom: 12px;
            background: #000;
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
        }
        /* 툴바 (정렬/필터) */
        .tier-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 10px;
        }
        .tool-btn {
            background: #1e1e1e;
            color: #ddd;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .tool-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* 티어 등급 행 */
        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .tier-label {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 4px;
            line-height: 1.3;
            color: #fff;
            word-break: keep-all;
        }
        .tier-label.ss { background: #b82323; }
        .tier-label.s { background: #b8621b; }
        .tier-label.a { background: #b89d1b; color: #121212; }
        .tier-label.b { background: #337d33; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: center;
        }
        /* 캐릭터 미니 카드 */
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 52px;
            text-align: center;
            padding: 3px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9px;
            margin-top: 3px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- 상단 시리즈 배너 이미지 (예: 다이너마이트 군단 등) -->
    <div class="tier-banner">
        <img src="IMG_banner.png" alt="시리즈 배너">
    </div>

    <!-- 정렬 / 필터 버튼 -->
    <div class="tier-toolbar">
        <button class="tool-btn">정렬</button>
        <button class="tool-btn">필터</button>
    </div>

    <!-- 티어표 리스트 -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
        
        <!-- SS 등급 -->
        <div class="tier-row">
            <div class="tier-label ss">SS<br>최고의 군단</div>
            <div class="tier-cards-area">
                <div class="t-card"><img src="IMG_1492.png"><div class="t-name">이자나기</div></div>
                <div class="t-card"><img src="IMG_1568.png"><div class="t-name">냥돌이</div></div>
            </div>
        </div>

        <!-- S 등급 -->
        <div class="tier-row">
            <div class="tier-label s">S<br>강력한 핵심</div>
            <div class="tier-cards-area">
                <div class="t-card"><img src="IMG_1530.png"><div class="t-name">세이버</div></div>
            </div>
        </div>

        <!-- A 등급 -->
        <div class="tier-row">
            <div class="tier-label a">A<br>범용 채용</div>
            <div class="tier-cards-area">
                <div class="t-card"><img src="IMG_1582.png"><div class="t-name">캉캉</div></div>
            </div>
        </div>

        <!-- B 등급 -->
        <div class="tier-row">
            <div class="tier-label b">B<br>애정/특화</div>
            <div class="tier-cards-area">
                <div class="t-card"><img src="IMG_1571.png"><div class="t-name">강시</div></div>
            </div>
        </div>

    </div>

</body>
</html>
