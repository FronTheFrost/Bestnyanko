<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥코대전쟁 시리즈별 티어표</title>
    <style>
        :root {
            --bg-color: #282828;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 상단 배너 (클릭 시 테두리 잔상 제거) */
        .tier-banner {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            transition: border-color 0.2s ease;
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        /* 티어표 전체 컨테이너 */
        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.25s ease-out;
        }
        .tier-content-wrapper.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 티어 등급 행 */
        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
        }
        /* SS ~ D 등급별 색상 분기 */
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: center;
        }
        /* 캐릭터 미니 카드 */
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 52px;
            text-align: center;
            padding: 3px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9px;
            margin-top: 3px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- 상단 시리즈 배너 이미지 (IMG_1601.jpeg) -->
    <div class="tier-banner" onclick="toggleTierList()">
        <img src="IMG_1601.jpeg" alt="다이너마이트 군단 배너">
    </div>

    <!-- 배너를 눌렀을 때 나타나는 티어표 영역 (SS ~ D) -->
    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            
            <!-- SS 등급 -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1584.png"><div class="t-name">야옹마</div></div>
                </div>
            </div>

            <!-- S 등급 -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area">
                    <!-- 없음 -->
                </div>
            </div>

            <!-- A 등급 -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1526.png"><div class="t-name">파라딘</div></div>
                    <div class="t-card"><img src="IMG_1538.png"><div class="t-name">머신・멸</div></div>
                    <div class="t-card"><img src="IMG_1610.png"><div class="t-name">신 라스트</div></div>
                    <div class="t-card"><img src="IMG_1615.png"><div class="t-name">모모코</div></div>
                </div>
            </div>

            <!-- B 등급 -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1607.png"><div class="t-name">베이비월드</div></div>
                    <div class="t-card"><img src="IMG_1611.png"><div class="t-name">사토루</div></div>
                </div>
            </div>

            <!-- C 등급 -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1564.png"><div class="t-name">변신소녀 단</div></div>
                    <div class="t-card"><img src="IMG_1603.png"><div class="t-name">아이스</div></div>
                    <div class="t-card"><img src="IMG_1609.png"><div class="t-name">퀘스트헤븐</div></div>
                    <div class="t-card"><img src="IMG_1613.png"><div class="t-name">메카다이너</div></div>
                </div>
            </div>

            <!-- D 등급 -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1608.png"><div class="t-name">간호사</div></div>
                    <div class="t-card"><img src="IMG_1612.png"><div class="t-name">텐구</div></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');
        }
    </script>

</body>
</html>
