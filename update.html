<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최근 변경 사항</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .patch-notes-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .patch-header {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .patch-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 직관적인 카드형 변경 내역 스타일 */
        .patch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px 10px;
        }

        .patch-char-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 캐릭터 미니 카드 */
        .p-card {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 6px;
            width: 50px;
            text-align: center;
            padding: 3px 2px;
            flex-shrink: 0;
        }
        .p-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .p-name {
            font-size: 8.5px;
            line-height: 1.2;
            margin-top: 3px;
            color: #ddd;
            word-break: keep-all;
        }

        .patch-desc {
            font-size: 11.5px;
            font-weight: bold;
            color: #fff;
        }

        .patch-badge {
            background: #b89d1b; /* A등급 황금색 포인트 */
            color: #121212;
            font-size: 10.5px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="patch-notes-box">
        <div class="patch-header">최근 변경 사항</div>
        <div class="patch-content">
            <div class="patch-row">
                <div class="patch-char-info">
                    <!-- 흰 토끼 이미지 -->
                    <div class="p-card">
                        <img src="souls/IMG_1773.png" alt="메가 샤크 VS 흰 토끼">
                        <div class="p-name">메가 샤크 VS 흰 토끼</div>
                    </div>
                    <span class="patch-desc">울트라 소울즈 신규 캐릭터 추가</span>
                </div>
                <div class="patch-badge">A 추가</div>
            </div>
        </div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'updateFrame', height: currentHeight }, '*');
        }

        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
