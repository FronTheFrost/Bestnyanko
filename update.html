<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최근 변경 사항</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .patch-notes-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .patch-header {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .patch-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 직관적인 카드형 변경 내역 스타일 */
        .patch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px 10px;
        }

        .patch-char-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 캐릭터 미니 카드 (틀은 고정, 내부 이미지에만 링크 기능 부여) */
        .p-card {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 6px;
            width: 50px;
            text-align: center;
            padding: 3px 2px;
            flex-shrink: 0;
        }

        /* 오직 '이미지'만 클릭 가능하도록 설정 */
        .p-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
            cursor: pointer;
            transition: transform 0.1s ease, border 0.2s ease;
            border: 1px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .p-card img:hover {
            border-color: var(--accent-color);
        }
        .p-card img:active {
            transform: scale(0.93);
        }

        .p-name {
            font-size: 8.5px;
            line-height: 1.2;
            margin-top: 3px;
            color: #ddd;
            word-break: keep-all;
        }

        .patch-desc {
            font-size: 11.5px;
            font-weight: bold;
            color: #fff;
        }

        .patch-badge {
            background: #b89d1b; /* 기본 황금색 포인트 */
            color: #121212;
            font-size: 10.5px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
        }
        /* SS등급 뱃지 색상 포인트 */
        .patch-badge.ss {
            background: #b82323;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="patch-notes-box">
        <div class="patch-header">최근 변경 사항</div>
        <div class="patch-content">
            <!-- 울트라 소울즈 신규 캐릭터 추가 내역 -->
            <div class="patch-row">
                <div class="patch-char-info">
                    <div class="p-card">
                        <img src="souls/IMG_1773.png" alt="메가 샤크 VS 흰 토끼" onclick="goToSoulsTier()">
                        <div class="p-name">메가 샤크 VS 흰 토끼</div>
                    </div>
                    <span class="patch-desc">울트라 소울즈 신규 캐릭터 추가</span>
                </div>
                <div class="patch-badge">A</div>
            </div>

            <!-- 기간트 제우스 하데스 티어 조정 내역 -->
            <div class="patch-row">
                <div class="patch-char-info">
                    <div class="p-card">
                        <img src="zeus/IMG_1491.png" alt="G데스 하데스" onclick="goToZeusTier()">
                        <div class="p-name">G데스 하데스</div>
                    </div>
                    <span class="patch-desc">기간트 제우스 티어 재조정</span>
                </div>
                <div class="patch-badge ss">SS</div>
            </div>
        </div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'updateFrame', height: currentHeight }, '*');
        }

        function goToSoulsTier() {
            if (window.parent && typeof window.parent.selectAndNavigateSeries === 'function') {
                window.parent.selectAndNavigateSeries({
                    id: "soulsFrame",
                    title: "초고대 전설의 용사 울트라 소울즈",
                    alias: ["울소", "울트라소울즈"]
                });
            }
        }

        function goToZeusTier() {
            if (window.parent && typeof window.parent.selectAndNavigateSeries === 'function') {
                window.parent.selectAndNavigateSeries({
                    id: "zeusFrame",
                    title: "궁극강림 기간트 제우스",
                    alias: ["제우스", "갓즈"]
                });
            }
        }

        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
