<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최근 변경 사항</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .patch-notes-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .patch-header {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .patch-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 직관적인 카드형 변경 내역 스타일 */
        .patch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px 10px;
        }

        .patch-char-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 캐릭터 미니 카드 (틀은 고정, 내부 이미지에만 링크 기능 부여) */
        .p-card {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 6px;
            width: 50px;
            text-align: center;
            padding: 3px 2px;
            flex-shrink: 0;
        }

        /* 오직 '이미지'만 클릭 가능하도록 설정 */
        .p-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
            cursor: pointer;
            transition: transform 0.1s ease, border 0.2s ease;
            border: 1px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .p-card img:hover {
            border-color: var(--accent-color);
        }
        .p-card img:active {
            transform: scale(0.93);
        }

        .p-name {
            font-size: 8.5px;
            line-height: 1.2;
            margin-top: 3px;
            color: #ddd;
            word-break: keep-all;
        }

        .patch-desc {
            font-size: 11.5px;
            font-weight: bold;
            color: #fff;
        }

        .patch-badge {
            background: #b89d1b; /* 기본 황금색 포인트 */
            color: #121212;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 7px;
            border-radius: 6px;
            white-space: nowrap;
        }
        
        /* 티어별 색상 정의 */
        .t-sss { background: #6c5ce7; color: #fff; }
        .t-ss  { background: #b82323; color: #fff; }
        .t-s   { background: #b8621b; color: #fff; }
        .t-a   { background: #b89d1b; color: #121212; }
        .t-b   { background: #337d33; color: #fff; }
        .t-c   { background: #236ab8; color: #fff; }

        /* 등급 이동 변경 내역 뱃지 스타일 */
        .patch-badge.change {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            font-size: 9.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
        }
        .patch-badge.change .tier-tag {
            font-size: 9.5px;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="patch-notes-box">
        <div class="patch-header">최근 변경 사항</div>
        <div class="patch-content">
            <!-- 인기 축제 신규 캐릭터 에타니스 추가 내역 -->
            <div class="patch-row">
                <div class="patch-char-info">
                    <div class="p-card">
                        <img src="festival/IMG_1966.png" alt="真理の探究者エターニス" onclick="goToFestivalTier()">
                        <div class="p-name">真理の探究者エターニス</div>
                    </div>
                    <span class="patch-desc">인기 축제 신규 캐릭터 추가</span>
                </div>
                <div class="patch-badge t-s">S</div>
            </div>

            <!-- 걸즈 몬스터즈 버베나 티어 변경 내역 -->
            <div class="patch-row">
                <div class="patch-char-info">
                    <div class="p-card">
                        <img src="IMG_1566.png" alt="행복한 신부 버베나" onclick="goToMonstersTier()">
                        <div class="p-name">행복한 신부 버베나</div>
                    </div>
                    <span class="patch-desc">행복한 신부 버베나 티어 변경</span>
                </div>
                <div class="patch-badge change">
                    <span class="tier-tag t-b">B</span>
                    <span>➔</span>
                    <span class="tier-tag t-sss">SSS</span>
                </div>
            </div>

            <!-- 갤럭시 걸즈 칼리파 티어 변경 내역 -->
            <div class="patch-row">
                <div class="patch-char-info">
                    <div class="p-card">
                        <img src="IMG_1967.png" alt="アルティメットＸＸカリファ" onclick="goToGalaxyTier()">
                        <div class="p-name">アルティメットＸＸカリファ</div>
                    </div>
                    <span class="patch-desc">アルティメットＸＸカリファ 티어 변경</span>
                </div>
                <div class="patch-badge change">
                    <span class="tier-tag t-s">S</span>
                    <span>➔</span>
                    <span class="tier-tag t-ss">SS</span>
                </div>
            </div>

            <!-- 갤럭시 걸즈 카이 티어 변경 내역 -->
            <div class="patch-row">
                <div class="patch-char-info">
                    <div class="p-card">
                        <img src="IMG_1514.png" alt="슈퍼 카이μ" onclick="goToGalaxyTier()">
                        <div class="p-name">슈퍼 카이μ</div>
                    </div>
                    <span class="patch-desc">슈퍼 카이μ 티어 변경</span>
                </div>
                <div class="patch-badge change">
                    <span class="tier-tag t-ss">SS</span>
                    <span>➔</span>
                    <span class="tier-tag t-s">S</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'updateFrame', height: currentHeight }, '*');
        }

        function goToFestivalTier() {
            if (window.parent && typeof window.parent.selectAndNavigateSeries === 'function') {
                window.parent.selectAndNavigateSeries({
                    id: "festivalFrame",
                    title: "인기 축제",
                    alias: ["축제", "인기축제"]
                });
            }
        }

        function goToMonstersTier() {
            if (window.parent && typeof window.parent.selectAndNavigateSeries === 'function') {
                window.parent.selectAndNavigateSeries({
                    id: "monstersFrame",
                    title: "절명 미소녀 걸즈 몬스터즈",
                    alias: ["걸즈몬스터즈", "몬스터즈"]
                });
            }
        }

        function goToGalaxyTier() {
            if (window.parent && typeof window.parent.selectAndNavigateSeries === 'function') {
                window.parent.selectAndNavigateSeries({
                    id: "galaxyFrame",
                    title: "사이버 학원 갤럭시 걸즈",
                    alias: ["갤럭시걸즈", "갤럭시"]
                });
            }
        }

        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
