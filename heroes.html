<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진격의 영웅 다크 히어로즈 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
        }
        .tier-content-wrapper.active {
            display: block !important;
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            min-height: 48px;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <!-- 다크 히어로즈 배너 (Raw 절대 주소 적용) -->
    <div class="tier-banner" onclick="toggleTierList()">
        <img src="https://raw.githubusercontent.com/FronTheFrost/Bestnyanko/main/IMG_1632.webp" alt="진격의 영웅 다크 히어로즈 배너">
    </div>

    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- SS등급 -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- S등급 (송골매, 제로그라비티) -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="heroes/IMG_1496.png"><div class="t-name">섬멸 송골매</div></div>
                    <div class="t-card"><img src="heroes/IMG_1679.png"><div class="t-name">성마탐정 제로그라비티</div></div>
                </div>
            </div>

            <!-- A등급 (캣맨, 스펙트르, 클레이, 사키) -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="heroes/IMG_1495.png"><div class="t-name">캣맨포에버</div></div>
                    <div class="t-card"><img src="heroes/IMG_1592.png"><div class="t-name">스펙트르 캣</div></div>
                    <div class="t-card"><img src="heroes/IMG_1562.png"><div class="t-name">과학자 클레이G</div></div>
                    <div class="t-card"><img src="heroes/IMG_1589.png"><div class="t-name">배드 블래스터 사키</div></div>
                </div>
            </div>

            <!-- B등급 (아키라, 메카소녀, 라이트닝잭) -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="heroes/IMG_1678.png"><div class="t-name">인펠・아키라</div></div>
                    <div class="t-card"><img src="heroes/IMG_1680.png"><div class="t-name">스페이스 메카소녀 진</div></div>
                    <div class="t-card"><img src="heroes/IMG_1681.png"><div class="t-name">라이트닝 잭</div></div>
                </div>
            </div>

            <!-- C등급 (아비스) -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="heroes/IMG_1682.png"><div class="t-name">시공 과학자 아비스 박사</div></div>
                </div>
            </div>

            <!-- D등급 (키클롭스, 엑셀) -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="heroes/IMG_1683.png"><div class="t-name">신마기사 키클롭스</div></div>
                    <div class="t-card"><img src="heroes/IMG_1684.png"><div class="t-name">더티 엑셀</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'heroesFrame', height: currentHeight }, '*');
        }

        // 페이지 로드 직후 및 이미지 로딩 완료 시점에 높이 자동 보고
        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);

        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');

            // 토글 애니메이션 전후로 높이 재전송
            setTimeout(sendHeight, 50);
            setTimeout(sendHeight, 300);
        }
    </script>
</body>
</html>
