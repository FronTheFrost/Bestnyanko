<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저 리뷰</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; color: #38bdf8; }
        
        /* 리뷰 작성 영역 (기본 숨김) */
        #admin-panel { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px; display: none; border: 1px solid #334155; }
        #login-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: center; border: 1px solid #334155; }
        
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .logout-btn { background: #ef4444; color: #fff; float: right; margin-bottom: 10px; }
        .logout-btn:hover { background: #dc2626; }

        /* 리뷰 카드 스타일 */
        .review-card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
        .review-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f1f5f9; }
        .review-content { font-size: 15px; line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; }
        .review-img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; max-height: 300px; }
        
        /* 관리자 로그인 버튼 토글용 스타일 */
        .admin-trigger { text-align: right; margin-bottom: 15px; }
        .admin-trigger button { background: transparent; color: #64748b; font-size: 12px; padding: 5px; }
        .admin-trigger button:hover { color: #f8fafc; }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-trigger">
        <button onclick="toggleLogin()">관리자 로그인</button>
    </div>

    <!-- 관리자 로그인 박스 -->
    <div id="login-box" style="display:none;">
        <h3>관리자 인증</h3>
        <p style="font-size:13px; color:#94a3b8; margin: 8px 0;">글 작성 및 업로드는 관리자만 가능합니다.</p>
        <input type="password" id="admin-pw" placeholder="관리자 비밀번호 입력" style="max-width: 250px; display: inline-block;">
        <button onclick="checkAdmin()">확인</button>
    </div>

    <!-- 리뷰 작성 패널 (관리자 전용) -->
    <div id="admin-panel">
        <button class="logout-btn" onclick="logoutAdmin()">로그아웃</button>
        <h3>새 리뷰 작성 (관리자 전용)</h3>
        <input type="text" id="review-title" placeholder="제목">
        <input type="text" id="review-author" placeholder="작성자 (예: 관리자)">
        <textarea id="review-text" rows="4" placeholder="내용을 입력하세요..."></textarea>
        <input type="file" id="review-image-file" accept="image/*">
        <button onclick="submitReview()">리뷰 등록하기</button>
    </div>

    <h1>유저 리뷰 목록</h1>
    <div id="reviews-container">
        <p style="text-align: center; color: #94a3b8;">리뷰를 불러오는 중...</p>
    </div>
</div>

<script>
    // 본인의 Supabase 정보 및 관리자 비밀번호 세팅 완료
    const SUPABASE_URL = 'https://vvbqjwbvqpppkmhnntlw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pcyr0OE4Tlaaa2Bh9BS_rg_7hpBwdmd';
    const ADMIN_SECRET_KEY = '0101'; // 윈터 생일

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 페이지 로드 시 리뷰 불러오기
    window.onload = function() {
        fetchReviews();
        if(localStorage.getItem('isAdmin') === 'true') {
            showAdminPanel();
        }
    };

    function toggleLogin() {
        const box = document.getElementById('login-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function checkAdmin() {
        const pw = document.getElementById('admin-pw').value;
        if(pw === ADMIN_SECRET_KEY) {
            localStorage.setItem('isAdmin', 'true');
            alert('관리자로 로그인되었습니다!');
            document.getElementById('admin-pw').value = '';
            document.getElementById('login-box').style.display = 'none';
            showAdminPanel();
        } else {
            alert('비밀번호가 틀렸습니다.');
        }
    }

    function showAdminPanel() {
        document.getElementById('admin-panel').style.display = 'block';
        document.querySelector('.admin-trigger').style.display = 'none';
    }

    function logoutAdmin() {
        localStorage.removeItem('isAdmin');
        document.getElementById('admin-panel').style.display = 'none';
        document.querySelector('.admin-trigger').style.display = 'block';
        alert('로그아웃되었습니다.');
    }

    // 리뷰 목록 불러오기 (방문객 누구나 가능)
    async function fetchReviews() {
        const container = document.getElementById('reviews-container');
        const { data, error } = await supabaseClient
            .from('reviews')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = '<p style="text-align:center; color:#ef4444;">리뷰를 불러오지 못했습니다.</p>';
            return;
        }

        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#94a3b8;">등록된 리뷰가 없습니다.</p>';
            return;
        }

        container.innerHTML = '';
        data.forEach(review => {
            let imageHtml = review.image_url ? `<img src="${review.image_url}" class="review-img">` : '';
            container.innerHTML += `
                <div class="review-card">
                    <div class="review-header">
                        <span>작성자: ${review.author}</span>
                        <span>${new Date(review.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="review-title">${review.title}</div>
                    <div class="review-content">${review.content}</div>
                    ${imageHtml}
                </div>
            `;
        });
    }

    // 리뷰 등록 (관리자만 가능)
    async function submitReview() {
        if(localStorage.getItem('isAdmin') !== 'true') {
            alert('권한이 없습니다.');
            return;
        }

        const title = document.getElementById('review-title').value;
        const author = document.getElementById('review-author').value;
        const content = document.getElementById('review-text').value;
        const imageFile = document.getElementById('review-image-file').files[0];

        if(!title || !content) {
            alert('제목과 내용을 입력해주세요.');
            return;
        }

        let imageUrl = '';

        // 이미지 파일이 있으면 Storage에 업로드
        if(imageFile) {
            const fileName = `${Date.now()}_${imageFile.name}`;
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('review-images')
                .upload(fileName, imageFile);

            if(uploadError) {
                alert('이미지 업로드 실패: ' + uploadError.message);
                return;
            }

            // 공개 URL 가져오기
            const { data: publicUrlData } = supabaseClient.storage
                .from('review-images')
                .getPublicUrl(fileName);
            
            imageUrl = publicUrlData.publicUrl;
        }

        // DB에 리뷰 저장
        const { error: insertError } = await supabaseClient
            .from('reviews')
            .insert([{ title, author: author || '관리자', content, image_url: imageUrl }]);

        if(insertError) {
            alert('리뷰 등록 실패: ' + insertError.message);
            return;
        }

        alert('리뷰가 등록되었습니다!');
        document.getElementById('review-title').value = '';
        document.getElementById('review-author').value = '';
        document.getElementById('review-text').value = '';
        document.getElementById('review-image-file').value = '';
        
        fetchReviews();
    }
</script>

</body>
</html>
