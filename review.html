<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저 리뷰 게시판</title>
    <!-- Supabase JS SDK 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --box-bg: #282828;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 12px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }

        input, textarea {
            width: 100%;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #e6b800;
        }

        .media-container img, .media-container video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        #admin-section {
            background-color: var(--box-bg);
            border: 2px dashed var(--accent-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 25px 0;
        }

        .loading, .empty {
            text-align: center;
            color: #888;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>유저 리뷰 게시판</h1>

    <!-- 관리자 인증 후 글을 쓸 수 있는 업로드 폼 -->
    <div id="admin-section">
        <h3>관리자 전용 글쓰기</h3>
        <div class="form-group">
            <label>관리자 비밀번호</label>
            <input type="password" id="adminPassword" placeholder="관리자 비밀번호 입력">
        </div>
        <div class="form-group">
            <label>제목</label>
            <input type="text" id="reviewTitle" placeholder="제목을 입력하세요">
        </div>
        <div class="form-group">
            <label>작성자</label>
            <input type="text" id="reviewAuthor" value="관리자" readonly>
        </div>
        <div class="form-group">
            <label>내용</label>
            <textarea id="reviewContent" rows="4" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="form-group">
            <label>사진 / 영상 첨부 (갤러리에서 직접 선택)</label>
            <input type="file" id="mediaFile" accept="image/*,video/*" style="padding: 6px;">
        </div>
        <button onclick="uploadReview()">리뷰 등록하기</button>
    </div>

    <hr>

    <h2 style="font-size: 18px; color: #fff; margin-bottom: 15px;">리뷰 목록 (방문객 구경 전용)</h2>
    <div id="reviewsList" class="loading">리뷰를 불러오는 중...</div>

    <script>
        // 본인의 Supabase 정보 입력
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const ADMIN_SECRET_KEY = '내관리자비번1234'; // 본인만 아는 관리자 비밀번호 설정

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 페이지 켜지자마자 리뷰 불러오기
        window.onload = function() {
            fetchReviews();
        };

        async function fetchReviews() {
            const listDiv = document.getElementById('reviewsList');

            const { data, error } = await _supabase
                .from('reviews')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                listDiv.innerHTML = '리뷰를 불러오는 중 에러가 발생했습니다.';
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = '<div class="empty">등록된 리뷰가 없습니다.</div>';
                return;
            }

            let html = '';
            data.forEach(review => {
                let mediaHtml = '';
                if (review.image_url) {
                    if (review.image_url.match(/\.(mp4|mov|webm)$/i)) {
                        mediaHtml = `<div class="media-container"><video src="${review.image_url}" controls width="100%"></video></div>`;
                    } else {
                        mediaHtml = `<div class="media-container"><img src="${review.image_url}" alt="첨부이미지"></div>`;
                    }
                }

                html += `
                    <div class="card">
                        <h3>${escapeHtml(review.title)}</h3>
                        <p style="font-size: 11px; color: #888; margin: 4px 0 10px 0;">작성자: ${escapeHtml(review.author)}</p>
                        <p style="font-size: 13px; line-height: 1.5; word-break: break-all;">${escapeHtml(review.content).replace(/\n/g, '<br>')}</p>
                        ${mediaHtml}
                    </div>
                `;
            });

            listDiv.innerHTML = html;
        }

        async function uploadReview() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd !== ADMIN_SECRET_KEY) {
                alert('관리자 비밀번호가 틀렸습니다!');
                return;
            }

            const title = document.getElementById('reviewTitle').value.trim();
            const author = document.getElementById('reviewAuthor').value.trim();
            const content = document.getElementById('reviewContent').value.trim();
            const fileInput = document.getElementById('mediaFile');

            if (!title || !content) {
                alert('제목과 내용을 모두 입력해주세요.');
                return;
            }

            let publicUrl = null;

            // 갤러리에서 고른 파일이 있다면 Storage에 업로드
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
                const filePath = `${fileName}`;

                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('review-images')
                    .upload(filePath, file);

                if (uploadError) {
                    alert('파일 업로드 실패: ' + uploadError.message);
                    return;
                }

                // 업로드된 파일의 public URL 가져오기
                const { data: publicURLData } = _supabase.storage
                    .from('review-images')
                    .getPublicUrl(filePath);

                publicUrl = publicURLData.publicUrl;
            }

            // DB에 리뷰 데이터 저장
            const { error: insertError } = await _supabase
                .from('reviews')
                .insert([{ title, author, content, image_url: publicUrl }]);

            if (insertError) {
                alert('리뷰 저장 실패: ' + insertError.message);
                return;
            }

            alert('리뷰가 성공적으로 등록되었습니다!');
            location.reload();
        }

        // HTML 특수문자 이스케이프 (보안 처리)
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
