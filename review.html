<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저 리뷰</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Quill 에디터 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; color: #38bdf8; }
        
        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #1e293b; padding: 12px 20px; border-radius: 10px; border: 1px solid #334155; }
        
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .logout-btn { background: #ef4444; color: #fff; }
        .logout-btn:hover { background: #dc2626; }

        /* 모달 팝업 */
        #write-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 750px; border: 1px solid #334155; position: relative; max-height: 95vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; right: 20px; background: transparent; color: #94a3b8; font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: #fff; }

        /* Quill 에디터 스타일 커스텀 (다크모드 맞춤) */
        .ql-toolbar.ql-snow { background: #1e293b; border-color: #475569 !important; border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .ql-container.ql-snow { background: #0f172a; border-color: #475569 !important; color: #fff; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; min-height: 250px; font-size: 15px; }
        .ql-snow .ql-stroke { stroke: #cbd5e1; }
        .ql-snow .ql-fill { fill: #cbd5e1; }
        .ql-snow .ql-picker { color: #cbd5e1; }

        /* 리뷰 카드 */
        .review-card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; position: relative; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
        .review-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f1f5f9; }
        
        /* 본문 내 이미지 출력 스타일 */
        .review-content { font-size: 15px; line-height: 1.6; margin-bottom: 12px; word-break: break-all; }
        .review-content img, .review-content video { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; display: block; }
        
        /* 관리자 전용 카드 제어 버튼 */
        .card-actions { margin-top: 15px; text-align: right; border-top: 1px solid #334155; padding-top: 10px; display: none; }
        .card-actions button { padding: 5px 12px; font-size: 12px; margin-left: 5px; }
        .edit-btn { background: #eab308; color: #0f172a; }
        .delete-btn { background: #ef4444; color: #fff; }

        .helper-text { font-size: 12px; color: #38bdf8; background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 10px; border: 1px dashed #334155; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span style="font-size: 14px; color: #94a3b8;">방문객은 리뷰 열람만 가능합니다.</span>
        <div>
            <span id="login-trigger-area">
                <input type="password" id="admin-pw" placeholder="관리자 비번" style="width: 110px; display: inline-block; margin: 0 5px 0 0; padding: 6px;">
                <button onclick="checkAdmin()">로그인</button>
            </span>
            <span id="admin-menu-area" style="display:none;">
                <button onclick="openWriteModal('create')" style="background: #10b981; color: #fff; margin-right: 5px;">✍️ 글쓰기</button>
                <button class="logout-btn" onclick="logoutAdmin()">로그아웃</button>
            </span>
        </div>
    </div>

    <h1>유저 리뷰 목록</h1>
    <div id="reviews-container">
        <p style="text-align: center; color: #94a3b8;">리뷰를 불러오는 중...</p>
    </div>
</div>

<!-- 글쓰기/수정 모달 -->
<div id="write-modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeWriteModal()">&times;</button>
        <h3 id="modal-heading" style="margin-bottom: 15px; color: #38bdf8;">새 리뷰 작성</h3>
        <input type="hidden" id="edit-review-id">
        
        <input type="text" id="review-title" placeholder="제목">
        <input type="text" id="review-author" placeholder="작성자" value="관리자">
        
        <div class="helper-text">
            💡 <strong>사진 첨부 요령:</strong> 본문 중간에 <strong>마우스나 터치로 커서를 두고</strong> 그림 아이콘을 누르면, 그 위치에 사진이 쏙 들어갑니다!
        </div>
        
        <!-- Quill 에디터가 생성될 영역 -->
        <div id="editor-container" style="margin-bottom: 15px;"></div>
        
        <button onclick="submitReview()" style="width: 100%; padding: 12px;" id="submit-btn">리뷰 등록하기</button>
    </div>
</div>

<!-- Quill 에디터 JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
    const SUPABASE_URL = 'https://vvbqjwbvqpppkmhnntlw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pcyr0OE4Tlaaa2Bh9BS_rg_7hpBwdmd';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let quill;
    let currentMode = 'create';
    let savedRange = null; // 커서 위치를 안전하게 저장할 변수

    window.onload = function() {
        quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ header: [1, 2, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    ['link', 'image', 'video'],
                    ['clean']
                ]
            }
        });

        // 에디터에서 커서가 바뀔 때마다 위치 기억하기
        quill.on('selection-change', function(range) {
            if (range) {
                savedRange = range;
            }
        });

        const toolbar = quill.getModule('toolbar');
        toolbar.addHandler('image', selectMultipleImages);

        fetchReviews();
        if(localStorage.getItem('isAdminAuth') === 'true') {
            enableAdminUI();
        }
    };

    function selectMultipleImages() {
        // 이미지를 고르기 직전의 커서 위치를 확실하게 백업
        let range = quill.getSelection();
        if (range) {
            savedRange = range;
        }

        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.setAttribute('multiple', 'true');
        input.click();

        input.onchange = async () => {
            const files = input.files;
            if (!files || files.length === 0) return;

            // 삽입할 기준 위치 선정 (저장된 커서 위치가 없으면 맨 뒤)
            let cursorIndex = savedRange ? savedRange.index : quill.getLength();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = `${Date.now()}_${i}_${file.name}`;
                
                const { data, error } = await supabaseClient.storage
                    .from('review-images')
                    .upload(fileName, file);

                if (error) {
                    alert(`이미지(${file.name}) 업로드 실패: ` + error.message);
                    continue;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('review-images')
                    .getPublicUrl(fileName);

                const imageUrl = publicUrlData.publicUrl;

                // 정확히 지정된 커서 위치에 이미지 삽입
                quill.insertEmbed(cursorIndex, 'image', imageUrl);
                cursorIndex += 1; // 다음 이미지를 위해 커서 한 칸 뒤로 이동
            }
            
            // 삽입이 모두 끝난 후 에디터 포커스와 커서 위치 재설정
            quill.setSelection(cursorIndex);
            savedRange = { index: cursorIndex, length: 0 };
        };
    }

    async function checkAdmin() {
        const inputPw = document.getElementById('admin-pw').value;
        if (!inputPw) return;

        const { data, error } = await supabaseClient
            .from('admin_config')
            .select('password')
            .eq('id', 1)
            .single();

        if (error || !data) {
            alert('인증 오류가 발생했습니다.');
            return;
        }

        if(inputPw === data.password) {
            localStorage.setItem('isAdminAuth', 'true');
            alert('관리자로 로그인되었습니다!');
            document.getElementById('admin-pw').value = '';
            enableAdminUI();
            fetchReviews();
        } else {
            alert('비밀번호가 틀렸습니다.');
        }
    }

    function enableAdminUI() {
        document.getElementById('login-trigger-area').style.display = 'none';
        document.getElementById('admin-menu-area').style.display = 'inline';
        document.querySelectorAll('.card-actions').forEach(el => el.style.display = 'block');
    }

    function logoutAdmin() {
        localStorage.removeItem('isAdminAuth');
        document.getElementById('admin-menu-area').style.display = 'none';
        document.getElementById('login-trigger-area').style.display = 'inline';
        document.querySelectorAll('.card-actions').forEach(el => el.style.display = 'none');
        alert('로그아웃되었습니다.');
    }

    function openWriteModal(mode, reviewData = null) {
        currentMode = mode;
        const modal = document.getElementById('write-modal');
        modal.style.display = 'flex';

        if(mode === 'create') {
            document.getElementById('modal-heading').innerText = '새 리뷰 작성';
            document.getElementById('submit-btn').innerText = '리뷰 등록하기';
            document.getElementById('edit-review-id').value = '';
            document.getElementById('review-title').value = '';
            quill.root.innerHTML = '';
            savedRange = null;
        } else if(mode === 'edit' && reviewData) {
            document.getElementById('modal-heading').innerText = '리뷰 수정하기';
            document.getElementById('submit-btn').innerText = '수정 완료하기';
            document.getElementById('edit-review-id').value = reviewData.id;
            document.getElementById('review-title').value = reviewData.title;
            document.getElementById('review-author').value = reviewData.author;
            quill.root.innerHTML = reviewData.content || '';
            savedRange = null;
        }
    }

    function closeWriteModal() {
        document.getElementById('write-modal').style.display = 'none';
    }

    async function fetchReviews() {
        const container = document.getElementById('reviews-container');
        const { data, error } = await supabaseClient
            .from('reviews')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = '<p style="text-align:center; color:#ef4444;">리뷰를 불러오지 못했습니다.</p>';
            return;
        }

        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#94a3b8;">등록된 리뷰가 없습니다.</p>';
            return;
        }

        const isAdmin = localStorage.getItem('isAdminAuth') === 'true';

        container.innerHTML = '';
        data.forEach(review => {
            const escapedReview = JSON.stringify(review).replace(/"/g, '&quot;');

            container.innerHTML += `
                <div class="review-card" id="card-${review.id}">
                    <div class="review-header">
                        <span>작성자: ${review.author}</span>
                        <span>${new Date(review.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="review-title">${review.title}</div>
                    <div class="review-content">${review.content}</div>
                    <div class="card-actions" style="display: ${isAdmin ? 'block' : 'none'};">
                        <button class="edit-btn" onclick='openWriteModal("edit", ${escapedReview})'>수정</button>
                        <button class="delete-btn" onclick="deleteReview('${review.id}')">삭제</button>
                    </div>
                </div>
            `;
        });
    }

    async function submitReview() {
        if(localStorage.getItem('isAdminAuth') !== 'true') {
            alert('권한이 없습니다.');
            return;
        }

        const reviewId = document.getElementById('edit-review-id').value;
        const title = document.getElementById('review-title').value.trim();
        const author = document.getElementById('review-author').value;
        const content = quill.root.innerHTML;
        
        const textLength = quill.getText().trim().length;
        const hasImages = content.includes('<img');

        if(!title || (textLength === 0 && !hasImages)) {
            alert('제목과 내용을 입력해주세요.');
            return;
        }

        if(currentMode === 'create') {
            const { error: insertError } = await supabaseClient
                .from('reviews')
                .insert([{ title, author: author || '관리자', content }]);

            if(insertError) {
                alert('리뷰 등록 실패: ' + insertError.message);
                return;
            }
            alert('리뷰가 등록되었습니다!');
        } else {
            const { error: updateError } = await supabaseClient
                .from('reviews')
                .update({ title, author: author || '관리자', content })
                .eq('id', reviewId);

            if(updateError) {
                alert('리뷰 수정 실패: ' + updateError.message);
                return;
            }
            alert('리뷰가 수정되었습니다!');
        }

        closeWriteModal();
        fetchReviews();
    }

    async function deleteReview(id) {
        if(localStorage.getItem('isAdminAuth') !== 'true') {
            alert('권한이 없습니다.');
            return;
        }

        if(!confirm('정말 이 리뷰를 삭제하시겠습니까?')) return;

        const { error } = await supabaseClient
            .from('reviews')
            .delete()
            .eq('id', id);

        if(error) {
            alert('삭제 실패: ' + error.message);
            return;
        }

        alert('리뷰가 삭제되었습니다.');
        fetchReviews();
    }
</script>

</body>
</html>
