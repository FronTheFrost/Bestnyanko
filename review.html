<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저 리뷰</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; color: #38bdf8; }
        
        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #1e293b; padding: 12px 20px; border-radius: 10px; border: 1px solid #334155; }
        
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .logout-btn { background: #ef4444; color: #fff; }
        .logout-btn:hover { background: #dc2626; }

        /* 모달 팝업 */
        #write-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; border: 1px solid #334155; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; right: 20px; background: transparent; color: #94a3b8; font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: #fff; }

        /* 리뷰 카드 */
        .review-card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
        .review-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f1f5f9; }
        .review-content { font-size: 15px; line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; }
        
        /* 미디어 정렬 (디시 스타일) */
        .media-wrapper { margin-top: 10px; width: 100%; display: flex; }
        .media-wrapper.left { justify-content: flex-start; }
        .media-wrapper.center { justify-content: center; }
        .media-wrapper.right { justify-content: flex-end; }
        
        .review-media { max-width: 100%; max-height: 400px; border-radius: 8px; object-fit: contain; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span style="font-size: 14px; color: #94a3b8;">방문객은 리뷰 열람만 가능합니다.</span>
        <div>
            <span id="login-trigger-area">
                <input type="password" id="admin-pw" placeholder="관리자 비번" style="width: 110px; display: inline-block; margin: 0 5px 0 0; padding: 6px;">
                <button onclick="checkAdmin()">로그인</button>
            </span>
            <span id="admin-menu-area" style="display:none;">
                <button onclick="openWriteModal()" style="background: #10b981; color: #fff; margin-right: 5px;">✍️ 글쓰기</button>
                <button class="logout-btn" onclick="logoutAdmin()">로그아웃</button>
            </span>
        </div>
    </div>

    <h1>유저 리뷰 목록</h1>
    <div id="reviews-container">
        <p style="text-align: center; color: #94a3b8;">리뷰를 불러오는 중...</p>
    </div>
</div>

<!-- 글쓰기 모달 -->
<div id="write-modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeWriteModal()">&times;</button>
        <h3 style="margin-bottom: 15px; color: #38bdf8;">새 리뷰 작성 (관리자 전용)</h3>
        <input type="text" id="review-title" placeholder="제목">
        <input type="text" id="review-author" placeholder="작성자" value="관리자">
        <textarea id="review-text" rows="6" placeholder="내용을 입력하세요..."></textarea>
        
        <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">이미지 또는 영상 첨부</label>
        <input type="file" id="review-media-file" accept="image/*,video/*">

        <label style="font-size: 13px; color: #94a3b8; display: block; margin: 10px 0 5px 0;">미디어 위치 정렬</label>
        <select id="media-align">
            <option value="left">좌측 정렬</option>
            <option value="center" selected>가운데 정렬</option>
            <option value="right">우측 정렬</option>
        </select>
        
        <button onclick="submitReview()" style="width: 100%; margin-top: 15px; padding: 12px;">리뷰 등록하기</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://vvbqjwbvqpppkmhnntlw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pcyr0OE4Tlaaa2Bh9BS_rg_7hpBwdmd';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = function() {
        fetchReviews();
        if(localStorage.getItem('isAdminAuth') === 'true') {
            enableAdminUI();
        }
    };

    // DB에 저장된 비밀번호를 조회해서 검증 (소스코드 노출 원천 차단)
    async function checkAdmin() {
        const inputPw = document.getElementById('admin-pw').value;
        if (!inputPw) return;

        const { data, error } = await supabaseClient
            .from('admin_config')
            .select('password')
            .eq('id', 1)
            .single();

        if (error || !data) {
            alert('인증 오류가 발생했습니다.');
            return;
        }

        if(inputPw === data.password) {
            localStorage.setItem('isAdminAuth', 'true');
            alert('관리자로 로그인되었습니다!');
            document.getElementById('admin-pw').value = '';
            enableAdminUI();
        } else {
            alert('비밀번호가 틀렸습니다.');
        }
    }

    function enableAdminUI() {
        document.getElementById('login-trigger-area').style.display = 'none';
        document.getElementById('admin-menu-area').style.display = 'inline';
    }

    function logoutAdmin() {
        localStorage.removeItem('isAdminAuth');
        document.getElementById('admin-menu-area').style.display = 'none';
        document.getElementById('login-trigger-area').style.display = 'inline';
        alert('로그아웃되었습니다.');
    }

    function openWriteModal() {
        document.getElementById('write-modal').style.display = 'flex';
    }

    function closeWriteModal() {
        document.getElementById('write-modal').style.display = 'none';
    }

    async function fetchReviews() {
        const container = document.getElementById('reviews-container');
        const { data, error } = await supabaseClient
            .from('reviews')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = '<p style="text-align:center; color:#ef4444;">리뷰를 불러오지 못했습니다.</p>';
            return;
        }

        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#94a3b8;">등록된 리뷰가 없습니다.</p>';
            return;
        }

        container.innerHTML = '';
        data.forEach(review => {
            let mediaHtml = '';
            let alignClass = review.media_align || 'center';

            if (review.image_url) {
                if (review.image_url.match(/\.(mp4|webm|ogg)$/i)) {
                    mediaHtml = `
                        <div class="media-wrapper ${alignClass}">
                            <video src="${review.image_url}" class="review-media" controls></video>
                        </div>`;
                } else {
                    mediaHtml = `
                        <div class="media-wrapper ${alignClass}">
                            <img src="${review.image_url}" class="review-media">
                        </div>`;
                }
            }

            container.innerHTML += `
                <div class="review-card">
                    <div class="review-header">
                        <span>작성자: ${review.author}</span>
                        <span>${new Date(review.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="review-title">${review.title}</div>
                    <div class="review-content">${review.content}</div>
                    ${mediaHtml}
                </div>
            `;
        });
    }

    async function submitReview() {
        if(localStorage.getItem('isAdminAuth') !== 'true') {
            alert('권한이 없습니다.');
            return;
        }

        const title = document.getElementById('review-title').value;
        const author = document.getElementById('review-author').value;
        const content = document.getElementById('review-text').value;
        const mediaFile = document.getElementById('review-media-file').files[0];
        const mediaAlign = document.getElementById('media-align').value;

        if(!title || !content) {
            alert('제목과 내용을 입력해주세요.');
            return;
        }

        let mediaUrl = '';

        if(mediaFile) {
            const fileName = `${Date.now()}_${mediaFile.name}`;
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('review-images')
                .upload(fileName, mediaFile);

            if(uploadError) {
                alert('업로드 실패: ' + uploadError.message);
                return;
            }

            const { data: publicUrlData } = supabaseClient.storage
                .from('review-images')
                .getPublicUrl(fileName);
            
            mediaUrl = publicUrlData.publicUrl;
        }

        const { error: insertError } = await supabaseClient
            .from('reviews')
            .insert([{ 
                title, 
                author: author || '관리자', 
                content, 
                image_url: mediaUrl,
                media_align: mediaAlign 
            }]);

        if(insertError) {
            alert('리뷰 등록 실패: ' + insertError.message);
            return;
        }

        alert('리뷰가 등록되었습니다!');
        document.getElementById('review-title').value = '';
        document.getElementById('review-text').value = '';
        document.getElementById('review-media-file').value = '';
        closeWriteModal();
        
        fetchReviews();
    }
</script>

</body>
</html>
