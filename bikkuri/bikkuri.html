<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빅쿠리맨 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
        }
        .tier-content-wrapper.active {
            display: block !important;
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.sss { background: #6c5ce7; }
        .tier-label.ss  { background: #b82323; }
        .tier-label.s   { background: #b8621b; }
        .tier-label.a   { background: #b89d1b; color: #121212; }
        .tier-label.b   { background: #337d33; }
        .tier-label.c   { background: #236ab8; }
        .tier-label.d   { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="tier-banner" onclick="toggleTierList()">
        <img src="IMG_1863.jpeg" alt="빅쿠리맨 콜라보 배너">
    </div>

    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- SSS등급 -->
            <div class="tier-row">
                <div class="tier-label sss">SSS</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- SS등급 -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- S등급 (블랙 제우스) -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1563.png"><div class="t-name">암차신자 블랙 제우스</div></div>
                </div>
            </div>

            <!-- A등급 (헤드 로코코) -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1857.png"><div class="t-name">헤드 로코코</div></div>
                </div>
            </div>

            <!-- B등급 (슈퍼 데빌) -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1858.png"><div class="t-name">슈퍼D 데빌</div></div>
                </div>
            </div>

            <!-- C등급 (슈퍼 제우스, 천공신 제우스, 사탄마리아, 헤라클라이스트) -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1855.png"><div class="t-name">슈퍼S 제우스</div></div>
                    <div class="t-card"><img src="IMG_1856.png"><div class="t-name">ギガント全能神スーパーゼウス</div></div>
                    <div class="t-card"><img src="IMG_1859.png"><div class="t-name">원더마리아</div></div>
                    <div class="t-card"><img src="IMG_1860.png"><div class="t-name">ブラックライスト</div></div>
                </div>
            </div>

            <!-- D등급 (샤먼 칸) -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="IMG_1861.png"><div class="t-name">전정신 샤먼 칸</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 검색 전용 숨김 키워드 리스트 -->
    <div style="display: none;">
        <!-- 슈퍼 제우스 -->
        <div class="t-name">슈퍼 제우스</div>
        <div class="t-name">전능신 슈퍼 제우스</div>
        <div class="t-name">슈퍼S 제우스</div>

        <!-- 일판 슈퍼 제우스 -->
        <div class="t-name">天空神スーパーゼウス</div>
        <div class="t-name">ギガント全能神スーパーゼウス</div>

        <!-- 세인트 피닉스 -->
        <div class="t-name">세인트 피닉스</div>
        <div class="t-name">성전의화 세인트 피닉스</div>
        <div class="t-name">헤드 로코코</div>

        <!-- 슈퍼 데빌 -->
        <div class="t-name">슈퍼 데빌</div>
        <div class="t-name">위신 슈퍼 데빌</div>
        <div class="t-name">슈퍼D 데빌</div>

        <!-- 사탄마리아 -->
        <div class="t-name">사탄마리아</div>
        <div class="t-name">원더마리아</div>

        <!-- 헤라클라이스트 -->
        <div class="t-name">헤라클라이스트</div>
        <div class="t-name">퍼펙트 헤라클라이스트</div>
        <div class="t-name">ブラックライスト</div>

        <!-- 샤먼 칸 -->
        <div class="t-name">샤먼 칸</div>
        <div class="t-name">전정신 샤먼 칸</div>

        <!-- 블랙 제우스 -->
        <div class="t-name">블랙 제우스</div>
        <div class="t-name">암차신자 블랙 제우스</div>
    </div>

    <script>
        function sendHeight() {
            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'bikkuriFrame', height: currentHeight }, '*');
        }

        window.addEventListener('load', function() {
            sendHeight();
            setTimeout(sendHeight, 100);
        });
        window.addEventListener('resize', sendHeight);

        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');

            setTimeout(sendHeight, 50);
            setTimeout(sendHeight, 300);
        }
    </script>
</body>
</html>
