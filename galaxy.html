<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 학원 갤럭시 걸즈 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
        }
        .tier-content-wrapper.active {
            display: block !important;
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <!-- 깃허브 Raw 절대 주소로 배너 이미지 설정 -->
    <div class="tier-banner" onclick="toggleTierList()">
        <img src="https://raw.githubusercontent.com/FronTheFrost/Bestnyanko/main/IMG_1626.jpeg" alt="사이버 학원 갤럭시 걸즈 배너">
    </div>

    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- SS등급 (없음) -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area"></div>
            </div>

            <!-- S등급 (산디아, 카이, 시시루) -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="galaxy/IMG_1533.png"><div class="t-name">얼티밋・산디아β</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1514.png"><div class="t-name">슈퍼 카이μ</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1545.png"><div class="t-name">쌍둥이별 시시루와 코마리Φ</div></div>
                </div>
            </div>

            <!-- A등급 (윈디, 갓파, 칼리파, 잔다르크) -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="galaxy/IMG_1532.png"><div class="t-name">얼티밋・윈디α</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1660.png"><div class="t-name">샤이니 갓파κ</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1548.png"><div class="t-name">명계의XX칼리파</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1537.png"><div class="t-name">신성회장 잔다르크ψ</div></div>
                </div>
            </div>

            <!-- B등급 (쿠우, 리린, 페가사, 라클) -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="galaxy/IMG_1558.png"><div class="t-name">골드 쿠우γ</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1662.png"><div class="t-name">와이즈 리린π</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1664.png"><div class="t-name">요람의 페가사ν</div></div>
                    <div class="t-card"><img src="galaxy/IMG_1665.png"><div class="t-name">라클레스Σ</div></div>
                </div>
            </div>

            <!-- C등급 (테룬) -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="galaxy/IMG_1663.png"><div class="t-name">헌트리스 테룬ζ</div></div>
                </div>
            </div>

            <!-- D등급 (멜슈) -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="galaxy/IMG_1661.png"><div class="t-name">럭셔리 멜슈ξ</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');

            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'galaxyFrame', height: currentHeight }, '*');
        }
    </script>
</body>
</html>
