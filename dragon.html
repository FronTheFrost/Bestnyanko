<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초파괴 대제 드래곤 엠퍼러스 티어표</title>
    <style>
        :root {
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --border-color: #3d3d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            user-select: none;
            -webkit-user-select: none;
            overflow: visible !important;
        }

        .tier-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tier-banner:hover {
            border-color: var(--accent-color);
        }
        .tier-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-content-wrapper {
            display: none;
            margin-top: 10px;
        }
        .tier-content-wrapper.active {
            display: block !important;
        }

        .tier-row {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            min-height: 48px; /* 빈 칸일 때도 행 높이 유지 */
        }
        .tier-label {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 4px;
            color: #fff;
            flex-shrink: 0;
        }
        .tier-label.ss { background: #b82323; }
        .tier-label.s  { background: #b8621b; }
        .tier-label.a  { background: #b89d1b; color: #121212; }
        .tier-label.b  { background: #337d33; }
        .tier-label.c  { background: #236ab8; }
        .tier-label.d  { background: #555555; }

        .tier-cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            flex: 1;
            align-items: flex-start;
        }
        .t-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            width: 64px;
            text-align: center;
            padding: 4px 2px;
        }
        .t-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        .t-name {
            font-size: 9.5px;
            line-height: 1.25;
            margin-top: 4px;
            color: #ddd;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <!-- 드래곤 엠퍼러스 배너 -->
    <div class="tier-banner" onclick="toggleTierList()">
        <img src="https://raw.githubusercontent.com/FronTheFrost/Bestnyanko/main/IMG_1630.webp" alt="초파괴 대제 드래곤 엠퍼러스 배너">
    </div>

    <div class="tier-content-wrapper" id="tierContent">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- SS 등급 (빈 칸 유지) -->
            <div class="tier-row">
                <div class="tier-label ss">SS</div>
                <div class="tier-cards-area"></div>
            </div>
            <!-- S 등급 (빈 칸 유지) -->
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-cards-area"></div>
            </div>
            <!-- A 등급 -->
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="Dragon/IMG_1540.png"><div class="t-name">천마성용 바벨</div></div>
                </div>
            </div>
            <!-- B 등급 -->
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dragon/IMG_1640.png"><div class="t-name">용기사황제 바르스</div></div>
                    <div class="t-card"><img src="dragon/IMG_1649.png"><div class="t-name">폭룡기왕 볼네이도</div></div>
                </div>
            </div>
            <!-- C 등급 -->
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dragon/IMG_1638.png"><div class="t-name">성룡황제 메기도라</div></div>
                    <div class="t-card"><img src="dragon/IMG_1645.png"><div class="t-name">각룡황제 그라디오스</div></div>
                    <div class="t-card"><img src="dragon/IMG_1646.png"><div class="t-name">사룡황제 헤비저크</div></div>
                    <div class="t-card"><img src="dragon/IMG_1647.png"><div class="t-name">해룡황제 다라이어던</div></div>
                </div>
            </div>
            <!-- D 등급 -->
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-cards-area">
                    <div class="t-card"><img src="dragon/IMG_1639.png"><div class="t-name">지룡황제 소돔</div></div>
                    <div class="t-card"><img src="dragon/IMG_1641.png"><div class="t-name">신룡황제 카무쿠라</div></div>
                    <div class="t-card"><img src="dragon/IMG_1642.png"><div class="t-name">용병기황제 라이덴</div></div>
                    <div class="t-card"><img src="dragon/IMG_1643.png"><div class="t-name">패룡대제 디오라무스</div></div>
                    <div class="t-card"><img src="dragon/IMG_1644.png"><div class="t-name">고룡황제 강글리온</div></div>
                    <div class="t-card"><img src="dragon/IMG_1648.png"><div class="t-name">포룡왕 건듀로스</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTierList() {
            const content = document.getElementById('tierContent');
            content.classList.toggle('active');

            const currentHeight = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resizeHeight', id: 'dragonFrame', height: currentHeight }, '*');
        }
    </script>
</body>
</html>
